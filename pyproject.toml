[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sat-sim"
version = "0.1.0"
description = "A starter Python application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pyorbital>=1.13.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
sat-sim = "sat_sim.app:main"
sat-sim-telemetry = "sat_sim_telemetry.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
docs = ["mkdocs>=1.6,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sat_sim", "src/sat_sim_telemetry", "src/pus_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sat_sim --cov=sat_sim_telemetry --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pyorbital.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]

[tool.ruff.format]
quote-style = "double"
