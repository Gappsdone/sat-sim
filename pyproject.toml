[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sat-sim"
version = "0.1.0"
description = "A starter Python application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyorbital>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sat_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
